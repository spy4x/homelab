# coturn configuration for MiroTalk P2P TURN relay.
# Mounted read-only into hl-mirotalk-coturn container at /etc/coturn/turnserver.conf.
#
# Plain UDP/TCP on 3478 only — no TURN-TLS (5349) for now.
# Media itself is DTLS-SRTP encrypted regardless; the TURN control
# channel is plaintext, acceptable for personal 1-on-1 use.
# Add TLS later by switching to traefik-certs-dumper sidecar.

listening-port=3478
# tls-listening-port=5349

listening-ip=
external-ip=${PUBLIC_IP}/${PUBLIC_IP}
relay-ip=${PUBLIC_IP}

min-port=10000
max-port=20000

fingerprint
lt-cred-mech
user=${TURN_SERVER_USERNAME}:${TURN_SERVER_CREDENTIAL}

server-name=${DOMAIN}
realm=${DOMAIN}

total-quota=500
stale-nonce=600

simple-log
no-stdout-log
